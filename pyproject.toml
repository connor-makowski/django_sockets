[tool.black]
line-length = 80
target-version = ['py39']
exclude = '/.*(__pycache__).*/'

[tool.setuptools]
py-modules = ["django_sockets"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django_sockets"
version = "2.0.1"
description = "Simplified Django websocket processes designed to work with cloud caches"
authors = [
    {name="Connor Makowski", email="conmak@mit.edu"}
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    'License :: OSI Approved :: MIT License',
    "Operating System :: OS Independent",
]
dependencies = [
    "django>=5.0.0,<7.0.0",
    "asgiref>=3.0.0,<4.0.0",
    "redis>=5.0.0,<9.0.0",
    "msgpack>=1.0.0,<2.0.0",
    "daphne>=4.0.0,<5.0.0",
    "channels>=4.0.0,<5.0.0"
]

[project.optional-dependencies]
dev = [
    "autoflake>=2.2.1",
    "black>=24.8.0",
    "build>=1.0.3",
    "nox>=2024.0.0",
    "pdoc>=15.0.0",
    "pytest>=8.0.0",
    "twine>=4.0.2",
    "virtualenv>=20.24.6",
]

[project.urls]
"Homepage" = "https://github.com/connor-makowski/django_sockets"
"Bug Tracker" = "https://github.com/connor-makowski/django_sockets/issues"
"Documentation" = "https://connor-makowski.github.io/django_sockets/django_sockets.html"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["[0-9]*.py"]